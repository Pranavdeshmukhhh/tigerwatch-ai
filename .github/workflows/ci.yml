name: Offline tests
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        name: Install browser for simulated-page integration tests
        run: python -m playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python main.py --demo
      - if: runner.os == 'Windows'
        name: Check setup script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/setup.ps1'), [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw $parseErrors[0] }
  postgres:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_postgres.py tests/test_postgres_v7.py
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:test-only-ci-password@127.0.0.1:5432/postgres
